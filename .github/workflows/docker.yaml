name: Build and publish Metabase image

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: build and smoke test image
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Check out repository
        uses: actions/checkout@ee0669bd1cc54295c223e0bb666b733df41de1c5

      - name: Select image tag
        id: image
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            tag=ci
          elif [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            tag="${GITHUB_REF_NAME#v}"
          else
            tag=main
          fi
          printf 'name=ghcr.io/posthog/metabase-clickhouse:%s\n' "$tag" >> "$GITHUB_OUTPUT"

      - name: Build image
        run: scripts/build-image.sh "${{ steps.image.outputs.name }}"

      - name: Verify release and bundled drivers
        run: scripts/smoke-test.sh "${{ steps.image.outputs.name }}" v0.64.1

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@dd4fa0671be5250ee6f50aedf4cb05514abda2c7
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish verified image
        if: github.event_name == 'push'
        run: docker push "${{ steps.image.outputs.name }}"

      - name: Inspect published digest
        if: github.event_name == 'push'
        run: docker buildx imagetools inspect "${{ steps.image.outputs.name }}"
