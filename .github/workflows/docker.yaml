name: Build and publish Metabase image

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  verify:
    name: build and smoke test image
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Check out repository
        uses: actions/checkout@ee0669bd1cc54295c223e0bb666b733df41de1c5

      - name: Build image
        run: scripts/build-image.sh metabase-clickhouse:ci

      - name: Verify release and bundled drivers
        run: scripts/smoke-test.sh metabase-clickhouse:ci v0.64.1

  publish:
    name: build, verify, and publish image
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@ee0669bd1cc54295c223e0bb666b733df41de1c5

      - name: Select image tag
        id: image
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            tag="${GITHUB_REF_NAME#v}"
          else
            tag=main
          fi
          printf 'name=ghcr.io/posthog/metabase-clickhouse:%s\n' "$tag" >> "$GITHUB_OUTPUT"

      - name: Build image
        env:
          IMAGE: ${{ steps.image.outputs.name }}
        run: scripts/build-image.sh "$IMAGE"

      - name: Verify release and bundled drivers
        env:
          IMAGE: ${{ steps.image.outputs.name }}
        run: scripts/smoke-test.sh "$IMAGE" v0.64.1

      - name: Log in to GHCR
        uses: docker/login-action@dd4fa0671be5250ee6f50aedf4cb05514abda2c7
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish verified image
        env:
          IMAGE: ${{ steps.image.outputs.name }}
        run: docker push "$IMAGE"

      - name: Inspect published digest
        env:
          IMAGE: ${{ steps.image.outputs.name }}
        run: docker buildx imagetools inspect "$IMAGE"
